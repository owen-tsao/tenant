<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1523">
<title>Tenant — Room</title>
<link rel="stylesheet" href="tenant.css">
</head>
<body>
<main class="stage" id="stage" aria-live="polite">
  <header class="topbar">
    <div class="room"><span class="mark" aria-hidden="true"></span><span class="eyebrow">Room</span><span class="code" id="code">····</span></div>
    <div class="sentence" id="statement">Connecting…</div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="regions">
    <section class="region guest">
      <div class="eyebrow">Guest</div>
      <div class="region-body">
        <div id="guests" class="stack" hidden></div>
        <div id="empty" class="empty" hidden>
          <div class="motif" id="motif" style="color: var(--accent)"></div>
          <div class="line">Nobody is here right now.</div>
        </div>
      </div>
    </section>

    <section class="region-col">
      <section class="region devices">
        <div class="eyebrow">In this room</div>
        <span class="corner"><span id="dev-count"></span><span class="segs" id="segs" aria-hidden="true"></span></span>
        <div class="region-body">
          <table class="grid">
            <colgroup><col class="c-dev"><col class="c-can"><col class="c-state"><col class="c-last"></colgroup>
            <thead><tr><th>Device</th><th>Can do</th><th>State</th><th>Last action</th></tr></thead>
            <tbody id="devices"></tbody>
          </table>
          <div class="quiet" id="dev-empty" hidden>Nothing has joined this room yet.</div>
        </div>
      </section>

      <section class="region ledger">
        <div class="eyebrow">What has happened</div>
        <div class="region-body" id="ledger"></div>
      </section>
    </section>
  </div>
</main>

<script src="shared.js"></script>
<script>
(function () {
  const T = window.Tenant;
  const $ = (id) => document.getElementById(id);
  let lastLogKey = null, host = null, lastState = null; const seenGuests = new Set();

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  $("motif").innerHTML = T.motif();

  function render(s) {
    lastState = s;
    $("code").textContent = s.room.code;

    // devices — hairline table: Device · Can do · State · Last action
    const log = (s.log || []).slice(0, 40);
    const lastFor = (d) => {
      if (d.last_action) return d.last_action;
      const r = log.find(x => x.text.includes(d.label));
      return r ? r.text : "Nothing yet";
    };
    const stateOf = (d) => !d.online ? ["off", "offline"] : d.busy ? ["live", "working"] : ["", "ready"];
    $("devices").innerHTML = s.devices.map(d => {
      const [cls, word] = stateOf(d);
      const words = d.caps.map(T.capWord).filter((v, i, a) => a.indexOf(v) === i);
      const can = words.slice(0, 3).join(", ") + (words.length > 3 ? ` <span class="more">+${words.length - 3} more</span>` : "");
      return `<tr class="${d.online ? "" : "offline"} ${d.busy ? "busy" : ""}">
        <td class="c-dev">${esc(d.label)}</td>
        <td class="c-can" title="${esc(words.join(", "))}">${can}</td>
        <td class="c-state"><span class="state"><span class="dot ${cls}"></span>${word}</span></td>
        <td class="c-last" title="${esc(lastFor(d))}">${esc(lastFor(d))}</td>
      </tr>`;
    }).join("");
    $("dev-empty").hidden = s.devices.length > 0;
    const online = s.devices.filter(d => d.online).length;
    $("dev-count").textContent = s.devices.length ? `${online} of ${s.devices.length} ready` : "";
    $("segs").innerHTML = s.devices.map(d => `<i class="${!d.online ? "" : d.busy ? "live" : "ready"}"></i>`).join("");

    // guest — the one pink block, or the quiet motif when nobody is here.
    // The block wipes in only the first time a guest appears; re-renders must not restart it.
    const g = s.guests || [];
    $("guests").innerHTML = g.map(x => `
      <div class="guest-block ${seenGuests.has(x.guest_id) ? "" : "paint"}" data-id="${esc(x.guest_id)}">
        <span class="who">${esc(x.display_name)} is here</span>
        <span class="left">${T.fmtClock(x.expires_in)}</span>
        <span class="how">${x.channel === "photon" ? "by text message" : "from the web"}${x.last_text ? ` · last asked “${esc(x.last_text)}”` : ""}</span>
      </div>`).join("");
    g.forEach(x => seenGuests.add(x.guest_id));
    $("guests").hidden = !g.length;
    $("empty").hidden = !!g.length;

    // the one state sentence: subject in 600, the rest in 400.
    // The Brain may supply room.sentence_subject / sentence_rest; otherwise we build both halves here.
    let subject, rest;
    if (s.room.sentence_subject) { subject = s.room.sentence_subject; rest = s.room.sentence_rest || ""; }
    else if (!online) { subject = "Nothing"; rest = " is connected to this room yet."; }
    else if (!g.length) { subject = `${online} device${online === 1 ? "" : "s"}`; rest = " ready. Nobody is here right now."; }
    else if (g.length === 1) { subject = g[0].display_name; rest = ` can use ${online} device${online === 1 ? "" : "s"} for the next ${Math.ceil(g[0].expires_in / 60)} min.`; }
    else { subject = `${g.length} guests`; rest = " are sharing this room."; }
    $("statement").innerHTML = `<b>${esc(subject)}</b>${esc(rest)}`;

    // ledger — newest first; the newest row wipes in once; empty shows one quiet line
    const key = log.length ? `${log[0].t}|${log[0].text}` : null;
    const fresh = key && key !== lastLogKey && lastLogKey !== null;
    lastLogKey = key;
    $("ledger").innerHTML = log.length ? log.map((r, i) => `
      <div class="row k-${esc(r.kind)} ${i === 0 && fresh ? "fresh" : ""}">
        <span class="t">${T.fmtTime(r.t)}</span><span class="text" title="${esc(r.text)}">${esc(r.text)}</span>
      </div>`).join("") : `<div class="quiet">Nothing has happened yet.</div>`;
  }

  // clock
  const tick = () => { $("clock").textContent = T.fmtTime(Date.now() / 1000); }; tick(); setInterval(tick, 1000);

  // host keys (not shown on screen): R held 1 s = reset; X = revoke the first guest; Shift+T = set host token
  let rTimer = null;
  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.key === "r" || e.key === "R") {
      rTimer = setTimeout(() => { host && host.host("host.reset"); rTimer = null; }, 1000);
    }
    if ((e.key === "x" || e.key === "X") && lastState && lastState.guests[0]) {
      host && host.host("host.revoke", { guest_id: lastState.guests[0].guest_id });
    }
    if (e.key === "t" && e.shiftKey) {
      const t = prompt("Host token"); if (t) localStorage.setItem("tenant.host_token", t.trim());
    }
  });
  window.addEventListener("keyup", (e) => { if ((e.key === "r" || e.key === "R") && rTimer) { clearTimeout(rTimer); rTimer = null; } });

  T.connectDisplay(render).then(h => { host = h; });
})();
</script>
</body>
</html>
